[project]
name = "kmb"
version = "0.1.0"
description = "Kalshi 15-minute crypto momentum bot: capture pipeline, replay and exchange simulator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "nats-py>=2.9",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.optional-dependencies]
ingest = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kmb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
